<div class="app-container">
  <nav class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo-wrap">
        <img class="sidebar-logo-img" src="assets/logo-dym.png" alt="DYM">
        <div class="sidebar-brand">
          <div class="sidebar-brand-name">AsistenteDYM</div>
          <div class="sidebar-brand-sub">Control de Asistencia</div>
        </div>
      </div>
    </div>

    <div class="sidebar-nav">
      <div class="nav-section-label">Principal</div>
      <a class="nav-item" routerLink="/admin/dashboard" routerLinkActive="active">
        <mat-icon>dashboard</mat-icon>
        <span class="nav-item-label">Dashboard</span>
      </a>
      <a class="nav-item" routerLink="/admin/employees" routerLinkActive="active">
        <mat-icon>people</mat-icon>
        <span class="nav-item-label">Empleados</span>
      </a>
      <a class="nav-item" routerLink="/admin/schedules" routerLinkActive="active">
        <mat-icon>calendar_month</mat-icon>
        <span class="nav-item-label">Horarios</span>
      </a>
      <div class="nav-section-label">Gestión</div>
      <a class="nav-item" routerLink="/admin/incidents" routerLinkActive="active">
        <mat-icon>warning_amber</mat-icon>
        <span class="nav-item-label">Incidencias</span>
        <span class="nav-badge" *ngIf="pendingCount > 0">{{pendingCount}}</span>
      </a>
      <a class="nav-item" routerLink="/admin/reports" routerLinkActive="active">
        <mat-icon>assessment</mat-icon>
        <span class="nav-item-label">Reportes</span>
      </a>
      <a class="nav-item" routerLink="/admin/settings" routerLinkActive="active">
        <mat-icon>settings</mat-icon>
        <span class="nav-item-label">Configuración</span>
      </a>
    </div>

    <img src="assets/logo-dym.png" class="sidebar-logo-large" alt="">

    <div class="sidebar-user">
      <div class="avatar" style="background:#4caf50;font-size:13px;font-weight:700;color:#fff">
        {{fullName.charAt(0)}}
      </div>
      <div class="sidebar-user-info">
        <div class="sidebar-user-name">{{fullName}}</div>
        <div class="sidebar-user-role">Administrador</div>
      </div>
      <button style="background:none;border:none;color:#8899aa;cursor:pointer;padding:4px" (click)="logout()" matTooltip="Cerrar sesión">
        <mat-icon style="font-size:18px;width:18px;height:18px">logout</mat-icon>
      </button>
    </div>
  </nav>

  <div class="main-area">
    <div class="topbar">
      <div class="topbar-title" id="page-title">Panel de Administración</div>
      <div class="topbar-date">{{today}}</div>
      <div class="live-pill" style="margin-left:12px"><span class="live-dot"></span>En vivo</div>
    </div>
    <router-outlet />
  </div>
</div>
